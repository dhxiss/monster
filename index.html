<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MONSTER 앱 받기</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css?v=monster-1">
</head>
<body class="download-page">
  <header><div class="brand"><span class="mark">M</span>MONSTER 앱</div></header>
  <main class="download-main">
    <section class="panel hero download-hero">
      <span class="mini">초대 받은 추천 코드</span>
      <div class="code" id="code">확인 중</div>
      <p class="sub">휴대폰에서 열면 추천 코드를 자동으로 복사합니다. 앱에 전달하면 해당 총판의 고객으로 등록됩니다.</p>
      <button id="copy" type="button">추천 코드 복사</button>
      <p id="message" class="status" role="status" aria-live="polite"></p>
    </section>
    <section class="panel download-steps">
      <h1>MONSTER 설치하기</h1>
      <div class="download-step">
        <div>
          <h2>앱 다운로드</h2>
          <p class="sub">앱 배포를 준비 중입니다. 다운로드는 아직 제공하지 않습니다.</p>
          <button id="download" class="download-action primary" type="button" disabled aria-describedby="downloadNotice">MONSTER APK 다운로드 · 준비 중</button>
          <p id="downloadNotice" class="status">다운로드가 열리면 이 페이지에서 안내합니다.</p>
        </div>
      </div>
    </section>
  </main>
  <script>
    const validReferral = code => /^[A-HJ-NP-Z2-9]{8}$/.test(code);

    const code = (new URLSearchParams(location.search).get('ref') || '').trim().toUpperCase();
    const valid = validReferral(code);
    const mobile = navigator.userAgentData?.mobile === true || /Android|iPhone|iPod/i.test(navigator.userAgent);
    const message = document.getElementById('message');
    document.getElementById('code').textContent = valid ? code : '유효한 추천 코드가 없습니다';

    let copied = false;
    let retryCopyOnTap = null;

    async function copyCode(showResult = true, showFailure = true) {
      if (!valid) return false;
      try {
        if (!navigator.clipboard?.writeText) throw new Error('클립보드 API를 사용할 수 없습니다.');
        await navigator.clipboard.writeText(code);
      } catch {
        const input = document.createElement('textarea');
        input.value = code;
        input.setAttribute('readonly', '');
        input.style.cssText = 'position:fixed;left:-9999px;top:0';
        document.body.append(input);
        input.select();
        let copied = false;
        try { copied = document.execCommand('copy'); } catch { /* 브라우저의 복사 제한은 안내 문구로 처리한다. */ }
        input.remove();
        if (!copied) {
          if (showFailure) message.textContent = '자동 복사가 제한됐습니다. 추천 코드 복사 버튼을 눌러주세요.';
          return false;
        }
      }
      copied = true;
      if (retryCopyOnTap) document.removeEventListener('click', retryCopyOnTap, true);
      if (showResult) message.textContent = '추천 코드를 복사했습니다. 설치 후 앱을 열어주세요.';
      return true;
    }

    if (valid) {
      if (mobile) {
        retryCopyOnTap = event => {
          if (!copied && !event.target.closest('#copy, #download')) void copyCode();
        };
        document.addEventListener('click', retryCopyOnTap, true);
        void copyCode(false, false).then(success => {
          if (success) message.textContent = '추천 코드가 자동으로 복사됐습니다. 설치 후 앱을 열어주세요.';
          else if (!copied) message.textContent = '화면을 한 번 누르면 추천 코드 복사를 다시 시도합니다.';
        });
      }
      document.getElementById('copy').addEventListener('click', () => { void copyCode(); });
    } else {
      document.getElementById('copy').disabled = true;
    }

  </script>
</body>
</html>
